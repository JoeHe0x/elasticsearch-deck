[package]
name = "es-deck"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
es-client = { path = "../es-client" }
es-deck-schema = { path = "../es-deck-schema" }
es-dsl-core = { path = "../es-dsl-core" }
es-dsl-lsp = { path = "../es-dsl-lsp" }
dirs = "6"
futures = "0.3"
gpui-kit.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
httpmock = "0.9"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[package.metadata.packager]
product-name = "elasticsearch-deck"
identifier = "dev.joehe0x.es-deck"
icons = ["assets/icon.png", "assets/icon.ico"]
formats = ["deb", "appimage", "nsis"]
description = "Elasticsearch desktop client with REST API and Query DSL completion"
authors = ["JoeHe0x <894598156@qq.com>"]

[package.metadata.packager.deb]
# Shared libs found with ldd; libraries GPUI loads with dlopen (Wayland, Vulkan) are not covered.
depends = ["libc6", "libxcb1", "libxcb-xkb1", "libxkbcommon0", "libxkbcommon-x11-0"]
